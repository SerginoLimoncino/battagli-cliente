<!doctype html>
<html lang="it"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Aggiornamento in corso</title>
<style>
:root{--bg:#f4f6f8;--card:#fff;--tx:#1d2430;--mu:#5b6575;--ac:#1f5fa8}
@media (prefers-color-scheme:dark){:root{--bg:#12161c;--card:#1b2129;--tx:#e8ecf1;--mu:#a3adbb;--ac:#6ea8ec}}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--tx);font:17px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;align-items:center;justify-content:center;padding:16px}
.c{background:var(--card);max-width:460px;width:100%;border-radius:16px;padding:32px 24px;text-align:center;box-shadow:0 2px 16px rgba(0,0,0,.08)}
.i{width:56px;height:56px;margin:0 auto 16px;border-radius:50%;border:5px solid var(--ac);border-top-color:transparent;animation:r 1.4s linear infinite}
@keyframes r{to{transform:rotate(360deg)}}
h1{font-size:22px;margin:0 0 10px}p{margin:0;color:var(--mu)}
</style></head><body>
<div class="c"><div class="i"></div>
<h1>Aggiornamento delle funzioni in corso</h1>
<p>Attendere: riapertura fra un'ora e mezza.</p></div>
<script>try{if(navigator.serviceWorker)navigator.serviceWorker.getRegistrations().then(function(r){r.forEach(function(x){x.unregister()})})}catch(e){}</script>
</body></html>
